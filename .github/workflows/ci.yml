name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
            syft_install: |
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          - os: windows-latest
            python: "3.11"
            syft_install: |
              powershell -Command "Invoke-WebRequest -Uri 'https://github.com/anchore/syft/releases/latest/download/syft_windows_amd64.zip' -OutFile 'syft.zip'; Expand-Archive -Path 'syft.zip' -DestinationPath '.local/bin' -Force; Remove-Item 'syft.zip'"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install syft
        run: ${{ matrix.syft_install }}
        shell: bash

      - name: Add .local/bin to PATH
        run: echo "$(pwd)/.local/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage
        shell: bash

      - name: Run verification (lite mode)
        run: python scripts/verificar_proyecto.py --lite
        shell: bash
        env:
          BETTER_MUTATION_ACTIVE: "1"

      - name: Run mutation check
        run: python scripts/mutation_check.py --batch --strict --umbral 0.85
        shell: bash

      - name: Generate SBOM
        run: python scripts/generate_sbom.py
        shell: bash

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.os }}-py${{ matrix.python }}
          path: sbom/
          retention-days: 7

      - name: Upload coverage report
        run: |
          python -m coverage report --show-missing
        shell: bash
        if: always()

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create audit venv
        run: python -m venv .venv-audit
      - name: Install pip-audit
        run: .venv-audit/bin/pip install pip-audit
      - name: Run advisories audit
        run: python scripts/audit_advisories.py --pip-audit-path .venv-audit/bin/pip-audit
      - name: Upload advisories report
        uses: actions/upload-artifact@v4
        with:
          name: advisories-report
          path: .docs/.storage/tydm_review.json
          retention-days: 7

  docs:
    name: Documentation Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate REQs
        run: python scripts/doc_validator.py --strict
      - name: Validate ADRs
        run: python scripts/adr_validator.py
      - name: Check lessons
        run: python scripts/lessons_extractor.py --check
      - name: Auto-audit
        run: python scripts/auto_audit.py all