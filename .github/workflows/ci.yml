name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    env:
      # P0.18: version fijada y SHA256 oficial del release (verificado 2026-09-26
      # contra syft_1.52.0_checksums.txt); sin curl | sh ni descargas sin hash.
      SYFT_VERSION: "v1.52.0"
      SYFT_SHA256_LINUX: "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d"
      SYFT_SHA256_WINDOWS: "de787a374cf961c56fd7b206b2e183295abba32d0af3cb44d9aef2357ca9eda2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: "Install syft - Linux (pin + SHA256, P0.18)"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${SYFT_VERSION#v}"
          curl -sSfL -o syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${version}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256_LINUX}  syft.tar.gz" | sha256sum -c -
          mkdir -p .local/bin
          tar -xzf syft.tar.gz -C .local/bin syft

      - name: "Install syft - Windows (pin + SHA256, P0.18)"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${SYFT_VERSION#v}"
          curl -sSfL -o syft.zip \
            "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${version}_windows_amd64.zip"
          echo "${SYFT_SHA256_WINDOWS}  syft.zip" | sha256sum -c -
          powershell -Command "Expand-Archive -Path 'syft.zip' -DestinationPath '.local/bin' -Force"

      - name: Add .local/bin to PATH
        run: echo "$(pwd)/.local/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage
        shell: bash

      - name: Run verification (lite mode)
        run: python scripts/verificar_proyecto.py --lite
        shell: bash
        env:
          BETTER_MUTATION_ACTIVE: "1"

      - name: Run mutation check
        run: python scripts/mutation_check.py --batch --strict --umbral 0.85
        shell: bash

      - name: Generate SBOM
        run: python scripts/generate_sbom.py
        shell: bash

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.os }}-py${{ matrix.python }}
          path: sbom/
          retention-days: 7

      - name: Upload coverage report
        run: |
          python -m coverage report --show-missing
        shell: bash
        if: always()

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create audit venv
        run: python -m venv .venv-audit
      - name: Install pip-audit
        run: .venv-audit/bin/pip install pip-audit
      - name: Run advisories audit
        run: python scripts/audit_advisories.py --pip-audit-path .venv-audit/bin/pip-audit --json > advisories-report.json
      - name: Upload advisories report
        uses: actions/upload-artifact@v4
        with:
          name: advisories-report
          path: advisories-report.json
          retention-days: 7

  docs:
    name: Documentation Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate REQs
        run: python scripts/doc_validator.py --strict
      - name: Validate ADRs
        run: python scripts/adr_validator.py
      - name: Check lessons
        run: python scripts/lessons_extractor.py --check
      - name: Auto-audit
        run: python scripts/auto_audit.py all