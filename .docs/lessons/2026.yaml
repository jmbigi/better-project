  recomendacion: "No presentar la ampliacion del set como mejora de exactitud (no lo es); reportar accuracy e IC junto a NLL/Brier/ECE y mantener el tipo score como experimental hasta superar de forma estable ~0.6 con >=100 casos/tipo. Recalibrar la temperatura al cambiar el set o el modelo."
  resolucion: "Set v13 (238 casos) calibrado con Qwen3.5-4B Q4_K_M: T=1.5, accuracy 0.660 [0.597,0.717]. Documentado en docs/ESTADO-JEV-LLAMA.md y docs/REVISION-SET-CALIBRACION.md; no se presenta como mejora."
