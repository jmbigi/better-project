- id: LSN-004
  proyecto: Ecosistema
  fase: Testing
  categoria: Proceso
  problema: "Una propuesta de mejora externa afirmaba que los scripts no tenian suite de pruebas; la afirmacion era falsa (tests/test_ecosistema.py ya cubria los cinco scripts) y aceptarla habria duplicado trabajo"
