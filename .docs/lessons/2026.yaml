  problema: "En opencode.json/kilo.json el MCP local 'verify-local' apuntaba a 'bash scripts/verificar-proyecto.sh' con \"cwd\": \"${workspace}\". Dos defectos: (1) ${workspace} no es una variable valida de opencode; se pasa literal, el directorio no existe y el spawn falla con ENOENT 'bash' (aunque /bin/bash si existe); (2) un script shell de verificacion no implementa el protocolo MCP (JSON-RPC por stdio), por lo que aunque arrancara el servidor no podria conectar."
