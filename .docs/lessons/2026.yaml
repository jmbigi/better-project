  categoria: "Riesgo_Tecnico"
  problema: "El set v15 (274 casos, lote 14) dio accuracy global 0.6496 [0.591,0.704] frente a 0.6641 del v14 (256); por tipo choice 0.811, noul 0.628, score 0.511; T recomendada 1.7. La exactitud baja (dentro del IC solapado) mientras el ECE mejora de 0.103 a 0.095."
