# --- Hook PreToolUse: analisis estatico del comando Bash (REQ-005) ---
# Kimi Code pasa el evento como JSON por stdin; el wrapper extrae
# tool_input.command y bloquea (exit 2) si analyze_shell.py halla
# patrones peligrosos. Fallo del analizador = bloqueo (deny-by-default).

[[hooks]]
event = "PreToolUse"
matcher = "Bash"
command = "python3 .kimi-code/hooks/pre_bash_analyze.py"
timeout = 10
