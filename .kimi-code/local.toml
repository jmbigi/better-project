# =============================================================================
# Adaptador del ruleset para Kimi Code CLI — REQ-005
# =============================================================================
# Fuente de verdad: opencode.json / kilo.json (304 patrones bash: 218 deny,
# 85 ask, 1 allow) + 14 patrones edit + 14 read + webfetch allow.
# Doc oficial: https://www.kimi.com/code/docs/en/kimi-code-cli/configuration/config-files.html
# Hooks:       https://www.kimi.com/code/docs/en/kimi-code-cli/customization/hooks.html
#
# ORDEN INVERTIDO RESPECTO A opencode.json/kilo.json (CRITICO):
#   - opencode/kilo usan LAST-match-wins: el allow comodin "*" va PRIMERO y
#     los deny/ask especificos lo override-an despues.
#   - Kimi Code documenta FIRST-match-wins: la PRIMERA regla cuyo patron
#     coincide gana. Por eso aqui el orden es:
#       1. excepciones allow (*.env.example) ANTES que sus denies generales
#       2. denies especificos (antes que los asks que podrian solaparse)
#       3. asks
#       4. catch-all allow (Bash(*), Edit(*), Read(*)) al FINAL
#   Este orden es compatible con ambas semanticas para deny/ask.
#
# CAVEAT — issue MoonshotAI/kimi-cli#2508 (v0.27.0): se reporta que el
# runtime real aplica prioridad por CLASE (deny > ask > allow) sin importar
# el orden, contradiciendo la doc. Bajo esa semantica la excepcion allow
# *.env.example perderia frente a *.env.* deny. Sin verificacion empirica
# (kimi-code no esta instalado en esta maquina): PENDIENTE.
#
# COBERTURA: los 304 patrones bash + 28 (edit/read) se portan como glob
# Bash(patron)/Edit(patron)/Read(patron). Familias cuya semantica exacta en
# el matcher de Kimi NO esta verificada (PENDIENTE, no omitidas): patrones
# con comillas embebidas (sh -c/bash -c "..." y '...'), globs con prefijo
# "*/" (invocacion por ruta absoluta), globs con "*" al inicio o en medio
# ("* * > *.env*", "psql * *DROP*") y "npx * -g *". El hook PreToolUse de
# abajo cubre en profundidad comillas, pipes, subcomandos encadenados y
# rutas absolutas, asi que esas familias tienen defensa en profundidad.
#
# CAVEAT local.toml: la doc oficial describe local.toml solo para settings
# de proyecto tipo [workspace]; es posible que [[permission.rules]] y
# [[hooks]] solo se carguen desde ~/.kimi-code/config.toml. Si el runtime
# los ignora aqui, copiar el contenido de este archivo al config.toml
# global. PENDIENTE de verificacion empirica.
#
# Hooks FAIL-OPEN: la doc oficial advierte que si el hook falla o hace
# timeout, el comando se PERMITE. El hook no es barrera unica; las reglas
# deny declarativas de arriba son la primera linea de defensa.
# =============================================================================
# --- Excepciones allow (ANTES que los denies: primer-match-gana) ---

[[permission.rules]]
decision = "allow"
pattern = "Edit(*.env.example)"

[[permission.rules]]
decision = "allow"
pattern = "Read(*.env.example)"

